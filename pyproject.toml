[project]
name = "ai-native-qa-agents"
version = "0.1.0"
description = "Evidence-driven QA agent reference architecture"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "PolyForm Noncommercial License 1.0.0" }

[project.scripts]
qa-agent = "qa_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
